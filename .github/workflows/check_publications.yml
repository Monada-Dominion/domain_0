name: Check Publications Backup

on:
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual execution via the Actions tab

jobs:
  check-backups:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyPDF2

      - name: Run Backup Checker
        run: |
          python3 researchGate_backup/check_backups.py
          
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add researchGate_backup/README.md
          if git diff --cached --quiet; then
            echo "No changes in publication backups."
          else
            git commit -m "docs: auto-update publications backup status table [skip ci]"
            git push || echo "Push failed, but continuing"
          fi
